
services:
  scalper:
    build:
      context: .
      dockerfile: Dockerfile
    image: edemoscar/xau-scalper:ml
    container_name: xau_scalper_ml
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    environment:
      - RUST_LOG=info
    env_file:
      - ./.env
