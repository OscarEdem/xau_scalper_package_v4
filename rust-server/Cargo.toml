[package]
name = "xau-scalper-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[dependencies.csv]
version = "1.3.0"

[dependencies.structopt]
version = "0.3.26"

[dependencies.rayon]
version = "1.8.1"
