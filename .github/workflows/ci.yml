name: CI / CD to AWS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  ECR_REGION: us-east-1
  EC2_REGION: eu-north-1
  ECR_REPOSITORY: xau-scalper-v4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. Build & Test + Docker Push
  # Consolidating these into one flow to maximize cache efficiency
  pipeline:
    name: Build, Test & Push
    runs-on: ubuntu-24.04 # Upgraded to 24.04 to match Docker glibc requirements
    steps:
      - uses: actions/checkout@v4

      # --- RUST CACHING (for tests) ---
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust-server -> target

      - name: Run Tests
        working-directory: rust-server
        run: cargo test --lib --verbose

      # --- DOCKER BUILD & PUSH ---
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          # GHA Cache: This is the primary speed booster
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Deploy to EC2
  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: pipeline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to ECR
            aws ecr get-login-password --region ${{ env.ECR_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.ECR_REGION }}.amazonaws.com

            # Create Network if not exists
            docker network create xau-net || true

            # Pull and Restart Scalper
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.ECR_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
            docker stop xau-scalper || true
            docker rm xau-scalper || true
            
            docker run -d \
              --name xau-scalper \
              --network xau-net \
              -p 3000:3000 \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              --restart always \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.ECR_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

            # Create Caddyfile on the fly
            cat <<EOF > Caddyfile
            xau-scalper-pro.duckdns.org {
                reverse_proxy xau-scalper:3000
            }
            EOF

            # Start Caddy for SSL
            docker stop caddy || true
            docker rm caddy || true
            docker run -d \
              --name caddy \
              --network xau-net \
              -p 80:80 \
              -p 443:443 \
              -v $(pwd)/Caddyfile:/etc/caddy/Caddyfile \
              -v caddy_data:/data \
              -v caddy_config:/config \
              --restart always \
              caddy:latest
