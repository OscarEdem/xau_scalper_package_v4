name: CI / CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Global permissions for the GITHUB_TOKEN
permissions:
  contents: read
  packages: write

# Opt into Node.js 24 now to silence deprecation warnings
env:
  REGISTRY: ghcr.io
  # Image name must be lowercase. Using the hardcoded lowercase version is fine,
  # but ensure it matches the repository name exactly.
  IMAGE_NAME: oscaredem/xau_scalper_package_v4_test
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Build & Test the Rust server
  # Runs on every push and pull request to main.
  # ─────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # dtolnay/rust-toolchain is the maintained successor to actions-rs/toolchain
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        working-directory: rust-server
        run: cargo build --release

      - name: Test (unit tests only — e2e tests require Postgres, run locally)
        working-directory: rust-server
        run: cargo test --lib --verbose

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Build & Push Docker image to GitHub Container Registry
  # Only runs on pushes to main (not on PRs) after tests pass.
  #
  # ⚠️  ONE-TIME SETUP REQUIRED (fixes 403 Forbidden):
  #   The package lives under your USER account, not the repository.
  #   GITHUB_TOKEN only gets push rights after you explicitly grant it:
  #
  #   1. Go to:
  #      https://github.com/users/oscaredem/packages/container/xau_scalper_package_v4/settings
  #   2. Scroll to "Manage Actions access"
  #   3. Click "Add Repository" → oscaredem/xau_scalper_package_v4 → Role: Write
  #
  #   Without that step this job will always fail with 403 Forbidden.
  # ─────────────────────────────────────────────────────────────────
  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN works once the package grants this repo Write access.
          # If it still 403s after the package settings step above, create a PAT
          # with write:packages scope and add it as secret GHCR_TOKEN, then
          # switch this line to: password: ${{ secrets.GHCR_TOKEN }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags:
      #   ghcr.io/oscaredem/xau_scalper_package_v4:latest
      #   ghcr.io/oscaredem/xau_scalper_package_v4:main
      #   ghcr.io/oscaredem/xau_scalper_package_v4:sha-<short>
      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Layer caching via GitHub Actions cache (fast rebuilds)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Tell Render to redeploy using the new :main image
  #
  # Requires secret RENDER_DEPLOY_HOOK_URL set in repo settings.
  # Get it from: Render Dashboard → Service → Settings → Deploy Hook
  # ─────────────────────────────────────────────────────────────────
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render deploy hook responded: HTTP $response"
          if [ "$response" != "200" ] && [ "$response" != "201" ] && [ "$response" != "202" ]; then
            echo "::error::Render deploy hook failed with HTTP $response"
            exit 1
          fi
          echo "✅ Render redeployment triggered successfully."
          echo "Monitor at: https://dashboard.render.com"
