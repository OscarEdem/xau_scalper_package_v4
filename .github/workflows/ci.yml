name: CI / CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  # Must match the existing GHCR package name exactly
  IMAGE_NAME: oscaredem/xau_scalper_package_v4

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Build & Test the Rust server
  # Runs on every push and pull request to main.
  # ─────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # dtolnay/rust-toolchain is the maintained successor to actions-rs/toolchain
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          # Fall back to any previous cache for the same OS if the lock file changed
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        working-directory: rust-server
        run: cargo build --release

      - name: Test
        working-directory: rust-server
        run: cargo test --verbose

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Build & Push Docker image to GitHub Container Registry
  # Only runs on pushes to main (not on PRs) after tests pass.
  # ─────────────────────────────────────────────────────────────────
  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write   # Required to push to GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable multi-platform builds (linux/amd64 + linux/arm64 for Render/Fly compatibility)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags:
      #   ghcr.io/oscaredem/xau_scalper_package_v4:latest
      #   ghcr.io/oscaredem/xau_scalper_package_v4:main
      #   ghcr.io/oscaredem/xau_scalper_package_v4:sha-<short>
      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Layer caching via GitHub Actions cache (fast rebuilds)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Tell Render to redeploy using the new :latest image
  #
  # Render-side setup (one-time, manual):
  #   1. Render Dashboard → New Web Service → "Existing Image"
  #   2. Image URL: ghcr.io/oscaredem/xau_scalper_package_v4:latest
  #   3. Registry Credentials → Add:
  #        Username: oscaredem
  #        Password: <GitHub PAT with read:packages scope>
  #        (Store PAT as GHCR_PAT in Render environment or GitHub secret)
  #   4. Settings → Deploy Hook → copy URL
  #   5. GitHub repo → Settings → Secrets → RENDER_DEPLOY_HOOK_URL → paste URL
  # ─────────────────────────────────────────────────────────────────
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render deploy hook responded: HTTP $response"
          if [ "$response" != "200" ] && [ "$response" != "201" ] && [ "$response" != "202" ]; then
            echo "::error::Render deploy hook failed with HTTP $response"
            exit 1
          fi
          echo "✅ Render redeployment triggered successfully."
          echo "Monitor at: https://dashboard.render.com"
